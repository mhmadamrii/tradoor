[package]
name = "tradoor-mcp"
description = "An MCP server over stdio: lets an AI read candle history and backtest Frost Script strategies."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tradoor-core.workspace = true
tradoor-codec = { workspace = true, features = ["gzip", "manifest"] }
tradoor-venues.workspace = true
tradoor-frost-script.workspace = true
tradoor-store = { path = "../../crates/store" }
tradoor-ingest = { path = "../../crates/ingest" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
